name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/browser/**"
      - "packages/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: "2"
  CARGO_TERM_COLOR: always

jobs:
  android:
    name: Android aarch64
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.1"
          targets: aarch64-linux-android

      - name: Cache de Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: android-aarch64
          cache-all-crates: "true"

      - name: Android NDK r30
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r30
          add-to-path: false

      - name: Entorno del NDK
        run: |
          NDK="${{ steps.ndk.outputs.ndk-path }}"
          for var in ANDROID_NDK ANDROID_NDK_HOME ANDROID_NDK_ROOT NDK_HOME; do
            echo "$var=$NDK" >> "$GITHUB_ENV"
          done
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang" >> "$GITHUB_ENV"

      - name: Dependencias de Linux
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev

      - name: Dioxus CLI
        uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@0.8.0-alpha.3

      - name: Configurar firma
        env:
          KEYSTORE_BASE64: ${{ secrets.APK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.APK_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secreto APK_KEYSTORE_BASE64"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > apps/browser/keystore.jks
          cat >> apps/browser/Dioxus.toml <<EOF

          [bundle.android]
          jks_file = "./apps/browser/keystore.jks"
          jks_password = "$KEYSTORE_PASSWORD"
          key_alias = "ferrum"
          key_password = "$KEYSTORE_PASSWORD"
          EOF

      - name: Compilar APK
        run: |
          dx bundle \
            --package browser \
            --release \
            --target aarch64-linux-android \
            --locked \
            --android \
            --package-types apk \
            --no-default-features \
            --features android-defaults

      - name: Recoger y verificar APK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BT="$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)"
          APK="$(find target/dx -path '*release*' -name '*.apk' -type f | head -1)"
          test -n "$APK"
          mkdir -p out
          cp "$APK" out/ferrum.apk
          ls -lh out/ferrum.apk
          unzip -t out/ferrum.apk | tail -1
          "$BT/apksigner" verify --verbose out/ferrum.apk | head -8
          "$BT/aapt2" dump badging out/ferrum.apk | head -6

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: ferrum-apk
          path: out/ferrum.apk
          archive: false
