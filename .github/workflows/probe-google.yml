name: Probe Google challenge

# Temporary diagnostic workflow: runs a saved Google "enable JavaScript"
# challenge through the Boa runtime on x86_64 (where Boa's nan-boxed value
# representation is supported) and prints navigation URLs, forwarded cookies
# and JS errors. The challenge lives on the throwaway `probe-stub` branch.
on:
  push:
    branches: [experimento-js]

jobs:
  probe:
    if: github.ref == 'refs/heads/experimento-js'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Los espejos de Ubuntu a veces fallan en DNS desde el runner:
      # elegimos el primero que responda y fijamos /etc/apt/sources.list a el.
      - name: Dependencias de Linux
        run: |
          set -euxo pipefail
          mirror=""
          for m in https://mirrors.kernel.org/ubuntu https://mirror.enzu.com/ubuntu https://ftp.ubuntu.com/ubuntu http://mirror.math.princeton.edu/ubuntu; do
            if curl -fsI --max-time 15 "$m/dists/noble/Release" >/dev/null 2>&1; then
              mirror="$m"; break
            fi
            echo "espejo inaccesible: $m"
          done
          if [ -z "$mirror" ]; then
            echo "ningun espejo de Ubuntu responde"
            exit 1
          fi
          echo "usando espejo: $mirror"
          echo "deb $mirror noble main universe restricted multiverse" | sudo tee /etc/apt/sources.list
          echo "deb $mirror noble-updates main universe restricted multiverse" | sudo tee -a /etc/apt/sources.list
          echo "deb $mirror noble-security main universe restricted multiverse" | sudo tee -a /etc/apt/sources.list
          sudo rm -f /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update -o Acquire::Retries=5 -o Acquire::http::Timeout=30
          for attempt in 1 2 3 4 5; do
            if sudo apt-get install -y --fix-missing libfontconfig1-dev pkg-config; then
              exit 0
            fi
            echo "apt-get install intento $attempt fallo; reintentando"
            sleep 15
          done
          exit 1

      - name: Descargar y decodificar reto
        run: |
          git fetch --depth=1 origin probe-stub
          git show FETCH_HEAD:stub.html.gz.b64 > stub.html.gz.b64
          python3 - <<'PY'
          import base64, gzip
          data = base64.b64decode(open("stub.html.gz.b64", "rb").read())
          with open("stub.html", "wb") as f:
              f.write(gzip.decompress(data))
          print("stub bytes:", len(open("stub.html", "rb").read()))
          PY

      - name: Ejecutar reto en Boa
        env:
          GOOGLE_STUB: ${{ github.workspace }}/stub.html
          RUST_MIN_STACK: "67108864"
          BLITZ_JS_TRACE: "1"
        run: cargo test -p blitz-vibey-script --test google_stub_probe -- --nocapture
