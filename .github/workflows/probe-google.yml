name: Probe Google challenge

# Temporary diagnostic workflow: runs a saved Google "enable JavaScript"
# challenge through the Boa runtime on x86_64 (where Boa's nan-boxed value
# representation is supported) and prints navigation URLs, forwarded cookies
# and JS errors.
on:
  workflow_dispatch:
    inputs:
      stub_gz_b64_a:
        description: First half of the gzip+base64 challenge HTML
        required: true
        type: string
      stub_gz_b64_b:
        description: Second half of the gzip+base64 challenge HTML
        required: true
        type: string

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Dependencias de Linux
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev pkg-config

      - name: Decodificar reto
        env:
          A: ${{ inputs.stub_gz_b64_a }}
          B: ${{ inputs.stub_gz_b64_b }}
        run: |
          python3 - <<'PY'
          import base64, gzip, os
          data = base64.b64decode(os.environ["A"] + os.environ["B"])
          with open("stub.html", "wb") as f:
              f.write(gzip.decompress(data))
          print("stub bytes:", os.path.getsize("stub.html"))
          PY

      - name: Ejecutar reto en Boa
        env:
          GOOGLE_STUB: stub.html
        run: cargo test -p blitz-vibey-script --test google_stub_probe -- --nocapture
