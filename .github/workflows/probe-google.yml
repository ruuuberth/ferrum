name: Probe Google challenge

# Temporary diagnostic workflow: runs a saved Google "enable JavaScript"
# challenge through the Boa runtime on x86_64 (where Boa's nan-boxed value
# representation is supported) and prints navigation URLs, forwarded cookies
# and JS errors. The challenge lives on the throwaway `probe-stub` branch.
on:
  push:
    branches: [experimento-js]

jobs:
  probe:
    if: github.ref == 'refs/heads/experimento-js'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Dependencias de Linux
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev pkg-config

      - name: Descargar y decodificar reto
        run: |
          git fetch --depth=1 origin probe-stub
          git show FETCH_HEAD:stub.html.gz.b64 > stub.html.gz.b64
          python3 - <<'PY'
          import base64, gzip
          data = base64.b64decode(open("stub.html.gz.b64", "rb").read())
          with open("stub.html", "wb") as f:
              f.write(gzip.decompress(data))
          print("stub bytes:", len(open("stub.html", "rb").read()))
          PY

      - name: Ejecutar reto en Boa
        env:
          GOOGLE_STUB: ${{ github.workspace }}/stub.html
          RUST_MIN_STACK: "67108864"
          BLITZ_JS_TRACE: "1"
        run: cargo test -p blitz-vibey-script --test google_stub_probe -- --nocapture
